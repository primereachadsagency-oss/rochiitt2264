  <style>
    :root {
      --bg-dark: #09090b;
      --card-bg: #141417;
      --card-border: #242429;
      --gold: #ffc400;
      --gold-glow: rgba(255, 196, 0, 0.25);
      --tg-blue: #0088cc;
      --tg-blue-hover: #0099e6;
      --success: #22c55e;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px 16px 90px 16px; /* Bottom space for sticky CTA */
    }

    /* Urgency Banner */
    .urgency-badge {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      animation: flash 1.2s infinite;
    }

    /* Main Card */
    .card {
      background: radial-gradient(circle at top, #1a1a20, var(--card-bg));
      border: 1px solid var(--card-border);
      border-radius: 24px;
      width: 100%;
      max-width: 410px;
      padding: 28px 20px 22px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    /* Profile Wrapper */
    .avatar-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .profile-img {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      object-fit: cover;
      box-shadow: 0 0 20px var(--gold-glow);
      display: block;
    }

    .verified-badge {
      position: absolute;
      bottom: 2px;
      right: 4px;
      background: #0088cc;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--card-bg);
      font-size: 13px;
      font-weight: bold;
    }

    /* Titles */
    .title {
      color: var(--gold);
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 6px;
    }

    .social-proof {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: flash 1.4s infinite;
    }

    /* Highlights Row */
    .highlights-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-bottom: 16px;
    }

    .highlight-box {
      background: #1c1c21;
      border: 1px solid #292932;
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
    }

    /* CTA Button with Shimmer */
    .cta-button {
      position: relative;
      width: 100%;
      background: linear-gradient(135deg, #0088cc, #006699);
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      padding: 16px 20px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0, 136, 204, 0.45);
      overflow: hidden;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease;
    }

    .cta-button::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(
        60deg,
        rgba(255, 255, 255, 0) 20%,
        rgba(255, 255, 255, 0.3) 50%,
        rgba(255, 255, 255, 0) 80%
      );
      transform: rotate(25deg);
      animation: shimmer 3s infinite ease-in-out;
    }

    .cta-button:active {
      transform: scale(0.98);
    }

    .telegram-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Value Pillars */
    .feature-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 16px;
    }

    .feature-item {
      background: #18181d;
      border: 1px solid #26262e;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #f1f5f9;
    }

    .feature-check {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.4);
      font-size: 11px;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Footer Navigation */
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
      width: 100%;
      justify-content: center;
    }

    .footer-links button {
      background: none;
      border: none;
      color: #71717a;
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.2s;
    }

    .footer-links button:hover {
      color: #e4e4e7;
    }

    /* Sticky Bottom Mobile Bar */
    .sticky-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(14, 14, 17, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid #27272a;
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      z-index: 100;
    }

    .sticky-btn {
      width: 100%;
      max-width: 410px;
      background: var(--tg-blue);
      color: #ffffff;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(0, 136, 204, 0.4);
    }

    /* Popups (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      z-index: 1000;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: #19191e;
      border: 1px solid #2f2f38;
      border-radius: 18px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      transform: scale(0.92);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2a2a33;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--gold);
    }

    .close-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 22px;
      cursor: pointer;
    }

    .modal-body {
      font-size: 13px;
      color: #d1d5db;
      line-height: 1.6;
      max-height: 240px;
      overflow-y: auto;
    }

    /* Keyframes */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
      0% { left: -60%; }
      40% { left: 140%; }
      100% { left: 140%; }
    }

    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>

  <script>
    // 5-minute countdown loop
    let duration = 5 * 60;
    const timerDisplay = document.getElementById('timer');

    setInterval(() => {
      let minutes = Math.floor(duration / 60);
      let seconds = duration % 60;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      seconds = seconds < 10 ? '0' + seconds : seconds;
      timerDisplay.textContent = `${minutes}:${seconds}`;

      if (--duration < 0) {
        duration = 5 * 60; // reset
      }
    }, 1000);

    // Meta Pixel Conversion Event
    function trackLead() {
      if (typeof fbq === 'function') {
        fbq('track', 'Lead');
      }
    }

    // Modal Content
    const modalData = {
      about: {
        title: "About Rochit Singh Stocks",

      },
      disclaimer: {

      },
      terms: {

      },
      privacy: {

        content: "We value your privacy. We do not sell or share personal user information with external third parties. Access to the Telegram channel is handled directly via Telegram's native privacy protocols."
      },
      contact: {
        title: "Support & Contact",
        content: "For community questions, collaborations, or inquiries, reach out through our official Telegram: <br><br><b>Telegram:</b> <a href='https://t.me/+fuaXs2SEPwUzYmM1' style='color:#0088cc;'>@RochitSinghStocks</a>"
      }
    };

    function openModal(key) {
      if (modalData[key]) {
        document.getElementById('modalTitle').innerText = modalData[key].title;
        document.getElementById('modalContent').innerHTML = modalData[key].content;
        document.getElementById('infoModal').classList.add('active');
      }
    }

    function closeModal() {
      document.getElementById('infoModal').classList.remove('active');
    }

    function closeModalOnOutsideClick(e) {
      if (e.target.classList.contains('modal-overlay')) {
        closeModal();
      }
    }
  </script>
